<!DOCTYPE html>
<!-- GNP-BUILD: sign v1.0.0 · 2026-11-16 -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Firmar documento - Guayacan</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#EFEAE0;color:#15201A;font-family:'Inter',system-ui,sans-serif;}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px;}
.brand{text-align:center;margin-bottom:20px;}
.brand img{max-width:200px;height:auto;}
.subtitle{text-align:center;font-size:.85rem;color:#6B7568;margin-bottom:20px;}
.card{background:#fff;border-radius:18px;padding:24px 22px;box-shadow:0 20px 40px -16px rgba(0,0,0,.18);}
h1{font-family:'Fraunces';font-weight:600;font-size:1.3rem;margin-bottom:6px;}
.meta{font-size:.78rem;color:#6B7568;margin-bottom:14px;}
.doc{white-space:pre-wrap;font-size:.92rem;line-height:1.6;background:#F6F2E8;border-radius:12px;padding:14px;margin-bottom:16px;}
label.chk{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:.88rem;margin:10px 0;}
input[type=text]{width:100%;border:1.5px solid #DDD6C4;border-radius:10px;padding:11px 12px;font-size:.92rem;font-family:'Inter';margin-top:6px;}
.hint{font-size:.78rem;color:#6B7568;margin-top:4px;}
.btn{width:100%;border:none;border-radius:11px;padding:14px;font-size:.93rem;font-weight:600;cursor:pointer;margin-top:14px;display:block;background:#1F3B2E;color:#FBF6EC;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{margin-top:12px;font-size:.86rem;padding:10px 13px;border-radius:9px;display:none;}
.msg.show{display:block;}
.msg.err{background:#FBE5EA;color:#A3274C;}
.msg.ok{background:#E6F2EA;color:#1F5C3A;}
.hideit{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="logo.png" alt="Guayacan Natural Preserve"></div>
  <div class="subtitle" id="subtitle">Firmar documento</div>

  <div class="card" id="loadCard"><p style="color:#6B7568;text-align:center;padding:10px 0;">Cargando...</p></div>

  <div class="card hideit" id="docCard">
    <h1 id="docTitle"></h1>
    <div class="meta" id="docMeta"></div>
    <div class="doc" id="docBody"></div>
    <div id="signZone">
      <label class="chk"><input type="checkbox" id="f_accept"><span id="acceptText">He leído el documento y lo acepto.</span></label>
      <label class="chk hideit" id="attestField"><input type="checkbox" id="f_attest"><span id="attestText"></span></label>
      <input type="text" id="f_name" autocomplete="name">
      <div class="hint" id="nameHint">Escribe tu nombre completo como firma.</div>
      <button class="btn" id="btnSign" onclick="doSign()">Firmar</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script src="/config.js"></script>
<script src="/engine-client.js"></script>
<script>
// A document the engine left for signature after the booking (the waiver is
// signed in the booking form; this page is the engine's signing link for any
// document that was not). The engine emails the link as site.guest_links.sign
// on this site: /sign?token=<document token>. Engine mode only: with the
// engine off there is nothing to sign here.
const ENGINE = !!(window.GnpEngine && window.GnpEngine.enabled());
const token = new URLSearchParams(window.location.search).get('token') || '';
let VIEW = null, L = 'ES';

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showLoadErr(m){ document.getElementById('loadCard').innerHTML = '<p style="color:#A3274C;text-align:center;padding:10px 0;">' + esc(m) + '</p>'; }
function setMsg(kind, text){ const m = document.getElementById('msg'); m.className = 'msg show ' + kind; m.textContent = text; }

async function load(){
  if (!ENGINE) { showLoadErr('No hay documentos para firmar en este sitio. / There are no documents to sign on this site.'); return; }
  if (!token) { showLoadErr('Token faltante. / Missing token.'); return; }
  try {
    const j = await GnpEngine.getJson(GnpEngine.documentUrl(token));
    if (!j.ok || !j.document) { showLoadErr(GnpEngine.errorText(j, 'No se pudo cargar. / Could not load.', 'ES')); return; }
    render(j.document);
  } catch (e) { showLoadErr(String(e)); }
}

function render(d){
  VIEW = d;
  L = d.lang === 'en' ? 'EN' : 'ES';
  const EN = L === 'EN';
  document.documentElement.lang = EN ? 'en' : 'es';
  document.getElementById('subtitle').textContent = EN ? 'Sign document' : 'Firmar documento';
  document.getElementById('loadCard').classList.add('hideit');
  document.getElementById('docCard').classList.remove('hideit');
  document.getElementById('docTitle').textContent = d.title || '';
  document.getElementById('docMeta').textContent = (EN ? 'Version ' : 'Versión ') + (d.version || '');
  document.getElementById('docBody').textContent = d.body || '';
  document.getElementById('acceptText').textContent = EN ? 'I have read the document and I accept it.' : 'He leído el documento y lo acepto.';
  document.getElementById('nameHint').textContent = EN ? 'Type your full name as your signature.' : 'Escribe tu nombre completo como firma.';
  document.getElementById('btnSign').textContent = EN ? 'Sign' : 'Firmar';
  document.getElementById('f_name').placeholder = EN ? 'Full name' : 'Nombre completo';
  if (d.adult_only) {
    document.getElementById('attestField').classList.remove('hideit');
    document.getElementById('attestText').textContent = d.attestation_text || '';
  }
  if (d.status !== 'pending') {
    document.getElementById('signZone').classList.add('hideit');
    setMsg(d.status === 'signed' ? 'ok' : 'err', GnpEngine.errorText({ error: d.status === 'signed' ? 'already_signed' : 'document_void' }, '', L));
  }
}

async function doSign(){
  let body;
  try {
    body = GnpEngine.signRequest(VIEW, { accept: document.getElementById('f_accept').checked, name: document.getElementById('f_name').value, attestAdult: document.getElementById('f_attest').checked });
  } catch (e) {
    const EN = L === 'EN';
    setMsg('err', e.code === 'accept_required' ? (EN ? 'Please accept the document.' : 'Acepta el documento.')
      : e.code === 'signer_name_required' ? (EN ? 'Type your full name.' : 'Escribe tu nombre completo.')
      : GnpEngine.errorText({ error: e.code }, e.message, L));
    return;
  }
  const btn = document.getElementById('btnSign'); btn.disabled = true;
  try {
    const j = await GnpEngine.postJson(GnpEngine.documentUrl(token, '/sign'), body);
    if (j && j.ok) {
      document.getElementById('signZone').classList.add('hideit');
      setMsg('ok', L === 'EN' ? 'Signed. Thank you.' : 'Firmado. Gracias.');
      return;
    }
    setMsg('err', GnpEngine.errorText(j, 'Error', L));
  } catch (e) { setMsg('err', String(e)); }
  btn.disabled = false;
}

load();
</script>
  <!-- swl-credit -->
  <div class="swl-credit" style="font-size:10px;text-align:center;opacity:.55;padding:14px 12px 18px;letter-spacing:.3px">Developed in the US by sketchwithlight LLC</div>
</body>
</html>
