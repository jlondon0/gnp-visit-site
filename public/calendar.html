.hero{position:relative;padding:36px 20px 22px;background:radial-gradient(120% 140% at 20% -10%, #2A4F3D 0%, var(--forest) 55%, var(--forest-deep) 100%);}
.hero::after{content:'';position:absolute;inset:auto 0 0 0;height:1px;background:var(--line);}

.lang-toggle button{background:none;border:0;color:var(--cream);opacity:.55;font-family:'Inter';font-size:.78rem;font-weight:600;letter-spacing:.04em;padding:7px 14px;cursor:pointer;transition:opacity .15s,background .15s;}
.lang-toggle button.active{opacity:1;background:rgba(251,246,236,.1);}
.back-link{position:absolute;top:24px;left:20px;font-size:.78rem;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:4px;}
.hero-copy{max-width:640px;margin:10px auto 0;text-align:center;}
.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;}
.hero h1{font-size:1.7rem;line-height:1.15;margin:8px 0 8px;font-weight:500;}
.hero p{font-size:.92rem;line-height:1.5;color:rgba(251,246,236,.78);max-width:46ch;margin:0 auto;}

.card{background:var(--cream);color:var(--ink);border-radius:22px;margin-top:-14px;position:relative;padding:22px 18px 24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);}

.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-nav button{width:36px;height:36px;border-radius:50%;border:1.5px solid #DDD6C4;background:#fff;font-size:1rem;cursor:pointer;color:var(--ink);}
.cal-nav button:disabled{opacity:.35;cursor:default;}
.cal-title{font-family:'Fraunces';font-size:1.15rem;text-transform:capitalize;}

.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.weekdays div{text-align:center;font-size:.68rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#8A8270;}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.day{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.82rem;font-weight:600;position:relative;background:#F6F2E8;color:#B9B2A0;}
.day.pad{background:transparent;}
.day.open{background:#E6F2EA;color:#1F5C3A;cursor:pointer;}
.day.limited{background:#FCEFDA;color:#8A5A16;cursor:pointer;}
.day.full{background:#FBE5EA;color:#A3274C;}
.day.disabled{background:#F6F2E8;color:#C9C2AE;cursor:default;}
.day.unknown{background:#EDEDE6;color:#4A5A50;cursor:pointer;}
.cal-degraded{text-align:center;font-size:.8rem;color:#8A5A16;background:#FCEFDA;border-radius:10px;padding:10px 12px;margin-bottom:12px;}
.cal-degraded a{color:#1F5C3A;font-weight:600;text-decoration:underline;}
.day.today::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6;}
.day:active.open, .day:active.limited{transform:scale(.94);}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px;font-size:.76rem;color:#5B6A60;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.legend .i-open{background:#5FAE7A;}
.legend .i-limited{background:var(--limited);}
.legend .i-full{background:var(--warn);}

.hint{font-size:.8rem;color:#5B6A60;margin-top:14px;line-height:1.5;}
.loading{text-align:center;padding:30px 0;color:#8A8270;font-size:.85rem;}

.foot{text-align:center;margin-top:30px;font-size:.78rem;color:rgba(251,246,236,.6);}
.foot a{text-decoration:underline;color:var(--gold);}

<script>
/* ============ CONFIG ============ */
// Same Apps Script Web App URL used by index.html.
const API_BASE = 'https://script.google.com/macros/s/AKfycbx4OJcB72Mqp3RiLB2iZdFv1j_Gt9NBPU6EgKbWnTVCWkdsKB6AXuVQR7a36iGHDEHC/exec';
const CAL_BUILD = 'v2.15 · 2026-07-16';
// Friendly session labels for the remaining-spots tooltip; falls back to the raw key.
const CONFIG_LABELS = {
  AMANECER: { ES: 'Amanecer', EN: 'Dawn' },
  TARDE:    { ES: 'Tarde',    EN: 'Afternoon' }
};

let LANG = 'ES';
let viewYear, viewMonth; // viewMonth 0-indexed
const today = new Date();
today.setHours(0,0,0,0);
const cache = {};

const I18N = {
  ES: {
    back: '← Reservar', eyebrow: 'Disponibilidad', h1: '¿Cuándo hay cupo?',
    sub: 'Elige un día disponible para ir directo a la solicitud de reserva.',
    legOpen: 'Disponible', legLimited: 'Últimos cupos', legFull: 'Agotado',
    foot: '¿Preguntas?', loading: 'Cargando disponibilidad...',
    degraded: 'No pudimos cargar la disponibilidad en vivo. Puedes elegir una fecha y enviar tu solicitud igualmente.', retry: 'Reintentar',
    minDays: 'Requiere mínimo {n} días de antelación. Los días grises no están disponibles para reservar en línea.',
    weekdays: ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],
    months: ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']
  },
  EN: {
    back: '← Book', eyebrow: 'Availability', h1: 'When are there spots?',
    sub: 'Pick an open day to jump straight to the reservation request.',
    legOpen: 'Available', legLimited: 'Almost full', legFull: 'Fully booked',
    foot: 'Questions?', loading: 'Loading availability...',
    degraded: 'We could not load live availability. You can still pick a date and send your request.', retry: 'Retry',
    minDays: 'Requires at least {n} days advance notice. Gray days cannot be booked online.',
    weekdays: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
    months: ['January','February','March','April','May','June','July','August','September','October','November','December']
  }
};

function setLang(L){
  LANG = L;
  document.getElementById('langEs').classList.toggle('active', L==='ES');
  document.getElementById('langEn').classList.toggle('active', L==='EN');
  const t = I18N[L];
  document.getElementById('t-back').textContent = t.back;
  document.getElementById('t-eyebrow').textContent = t.eyebrow;
  document.getElementById('t-h1').textContent = t.h1;
  document.getElementById('t-sub').textContent = t.sub;
  document.getElementById('t-legOpen').textContent = t.legOpen;
  document.getElementById('t-legLimited').textContent = t.legLimited;
  document.getElementById('t-legFull').textContent = t.legFull;
  document.getElementById('t-foot').textContent = t.foot;
  renderWeekdays();
  renderMonth();
}

function renderWeekdays(){
  const box = document.getElementById('weekdays');
  box.innerHTML = I18N[LANG].weekdays.map(d => '<div>'+d+'</div>').join('');
}

function changeMonth(delta){
  viewMonth += delta;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderMonth();
}

async function fetchMonth(year, month){
  const key = year + '-' + String(month+1).padStart(2,'0');
  if (cache[key]) return cache[key];
  const res = await fetch(API_BASE + '?action=calendar&month=' + key);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'calendar error');
  cache[key] = json.data;
  return json.data;
}

function dateStr(y,m,d){ return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }

async function renderMonth(){
  const t = I18N[LANG];
  document.getElementById('calTitle').textContent = t.months[viewMonth] + ' ' + viewYear;
  document.getElementById('calBody').innerHTML = '<div class="loading">'+t.loading+'</div>';

  const firstOfMonth = new Date(viewYear, viewMonth, 1);
  const isCurrentMonth = (viewYear === today.getFullYear() && viewMonth === today.getMonth());
  document.getElementById('prevBtn').disabled = isCurrentMonth;

  let data, degraded = false;
  try { data = await fetchMonth(viewYear, viewMonth); }
  catch(err){
    console.warn('calendar availability failed; degraded mode:', (err && err.message) || err);
    degraded = true;
    data = { days: {}, minDaysAdvance: 7 };
  }

  const minAdvance = data.minDaysAdvance != null ? data.minDaysAdvance : 7;
  const minDate = new Date(today); minDate.setDate(minDate.getDate() + Number(minAdvance || 0));

  const startWeekday = firstOfMonth.getDay(); // 0=Sun
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

  let html = '';
  for (let i=0;i<startWeekday;i++) html += '<div class="day pad"></div>';
  for (let d=1; d<=daysInMonth; d++){
    const ds = dateStr(viewYear, viewMonth, d);
    const cellDate = new Date(viewYear, viewMonth, d);
    const info = data.days ? data.days[ds] : null;
    const isTooSoon = cellDate < minDate;
    const isPast = cellDate < today;
    const unknown = !info;
    let cls = 'day';
    if (isPast || isTooSoon) cls += ' disabled';
    else if (unknown) cls += degraded ? ' unknown' : ' disabled';
    else cls += ' ' + info.status;
    if (cellDate.getTime() === today.getTime()) cls += ' today';
    const clickable = !isPast && !isTooSoon && ((info && info.status !== 'full') || (unknown && degraded));
    let title = '';
    if (info && info.remaining && (info.status === 'open' || info.status === 'limited')) {
      const parts = Object.keys(info.remaining).map(k => {
        const lbl = (CONFIG_LABELS[k] && CONFIG_LABELS[k][LANG]) || k;
        return lbl + ': ' + info.remaining[k];
      });
      title = parts.join(' · ');
    }
    html += '<div class="'+cls+'"'+(title ? ' title="'+title+'"' : '')+(clickable ? ' onclick="goBook(\''+ds+'\')"' : '')+'>'+d+'</div>';
  }
  const notice = degraded ? '<div class="cal-degraded">' + t.degraded + ' <a href="#" onclick="renderMonth();return false;">' + t.retry + '</a></div>' : '';
  document.getElementById('calBody').innerHTML = notice + '<div class="grid">' + html + '</div>';
  document.getElementById('dateHint').textContent = t.minDays.replace('{n}', minAdvance);

  // Warm the cache for the neighbouring months so navigation feels instant.
  prefetchNeighbors();
}

function prefetchNeighbors(){
  const around = [
    { y: viewYear, m: viewMonth + 1 },
    { y: viewYear, m: viewMonth - 1 }
  ];
  around.forEach(o => {
    let y = o.y, mo = o.m;
    if (mo < 0) { mo = 11; y--; }
    if (mo > 11) { mo = 0; y++; }
    // Don't prefetch months entirely in the past.
    if (y < today.getFullYear() || (y === today.getFullYear() && mo < today.getMonth())) return;
    fetchMonth(y, mo).catch(function(){});
  });
}

function goBook(ds){
  window.location.href = 'index.html?date=' + ds;
}

(async function init(){
  console.log('[GNP] calendar build ' + CAL_BUILD);
  viewYear = today.getFullYear();
  viewMonth = today.getMonth();
  renderWeekdays();
  renderMonth(); // calendar payload carries minDaysAdvance — no separate config round-trip needed
})();
</script>

  .gc-sub{display:none}
  #gcClose{background:rgba(20,42,32,.07);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
  .gc-msgs{padding:10px 16px}
  .gc-chips{padding:0 16px 10px}
  .gc-input{padding:10px 16px}
  #gnpChatPanel .gc-b{max-width:80%}
}
</style>
<script>
(function(){
  var root=document.getElementById('gnpChat'), btn=document.getElementById('gnpChatBtn'),
      panel=document.getElementById('gnpChatPanel'), msgs=document.getElementById('gcMsgs'),
      text=document.getElementById('gcText'), send=document.getElementById('gcSend'),
      closeBtn=document.getElementById('gcClose'), API=root.getAttribute('data-api');
  var API_BASE = location.hostname==='guayacanpreserve.com' ? '' : 'https://guayacanpreserve.com';
  var history=[], started=false, sending=false;
  function EN(){ return (document.documentElement.lang||'en').toLowerCase().indexOf('es')!==0; }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function md(s){ s=esc(s);
    s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s=s.replace(/(^|\s)(https?:\/\/[^\s<]+)/g,function(m,p,u){ return p+'<a href="'+u+'" target="_blank" rel="noopener">'+u.replace(/^https?:\/\//,'').replace(/\/$/,'')+'</a>'; });
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    return s; }
  function bubble(role,txt){ var d=document.createElement('div'); d.className='gc-b '+(role==='user'?'gc-u':'gc-a'); if(role==='user'){ d.textContent=txt; } else { d.innerHTML=md(txt); } msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d; }
  function isOpen(){ return panel.style.display!=='none' && !panel.hidden; }
  function fitVV(){ if(!isOpen()) return; var vv=window.visualViewport; if(!vv||window.innerWidth>560){ panel.style.top=''; panel.style.maxHeight=''; panel.style.bottom=''; return; }
    var kb=window.innerHeight-(vv.height+vv.offsetTop);
    if(kb>120){ var H=Math.min(vv.height-10,440); var top=Math.max(vv.offsetTop+6, vv.offsetTop+vv.height-H-4);
      panel.style.top=top+'px'; panel.style.maxHeight=H+'px'; panel.style.bottom='auto'; msgs.scrollTop=msgs.scrollHeight;
    } else { panel.style.top=''; panel.style.maxHeight=''; panel.style.bottom=''; } }
  function open(){ panel.style.display='flex'; panel.hidden=false; btn.style.display='none'; btn.classList.remove('gc-fly');
    var en=EN();
    document.getElementById('gcSub').textContent = en?'Assistant':'Asistente';
    document.getElementById('gcWaTxt').textContent = en?'Chat on WhatsApp':'Escríbenos por WhatsApp';
    text.placeholder = en?'Ask about your visit…':'Pregúntanos sobre tu visita…';
    document.getElementById('gcWa').href='https://wa.me/573102915558?text='+encodeURIComponent(en?'Hello, I have a question about Guayacán.':'Hola, tengo una pregunta sobre Guayacán.');
    if(!started){ started=true;
      var chipsEl=document.getElementById('gcChips');
      var chips=en?['Prices','Sessions','What birds','How to book']:['Precios','Jornadas','Qué aves','Cómo reservar'];
      chipsEl.innerHTML='';
      chips.forEach(function(c){ var b=document.createElement('button'); b.className='gc-chip'; b.textContent=c; b.onclick=function(){ text.value=c; ask(); }; chipsEl.appendChild(b); });
      bubble('assistant', en?'Hi! I can help with sessions, prices, what birds you might see, and how to book. What would you like to know?':'¡Hola! Te ayudo con jornadas, precios, qué aves podrías ver y cómo reservar. ¿Qué te gustaría saber?');
    }
    fitVV();
    if(window.innerWidth>560) text.focus();
  }
  function shut(){ panel.style.display='none'; panel.hidden=true; btn.style.display='flex'; text.blur(); }
  btn.addEventListener('click',open); closeBtn.addEventListener('click',shut);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&isOpen()) shut(); });
  btn.classList.add('gc-fly');
  if(window.visualViewport){ window.visualViewport.addEventListener('resize',fitVV); window.visualViewport.addEventListener('scroll',fitVV); }
  async function ask(){
    if(sending) return;
    var q=text.value.trim(); if(!q) return;
    text.value='';
    var ch=document.getElementById('gcChips'); if(ch) ch.innerHTML='';
    bubble('user',q); history.push({role:'user',content:q});
    var t=document.createElement('div'); t.className='gc-typing'; t.textContent='…'; msgs.appendChild(t); msgs.scrollTop=msgs.scrollHeight;
    sending=true; send.disabled=true;
    try{
      var r=await fetch(API_BASE+API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
      var d=await r.json(); t.remove();
      if(d.rate_limited){ bubble('assistant', EN()?'We are getting a lot of questions right now — please tap WhatsApp below and our team will help you directly.':'Estamos recibiendo muchas preguntas ahora — toca WhatsApp abajo y nuestro equipo te ayuda directamente.'); }
      else if(d.reply){ bubble('assistant',d.reply); history.push({role:'assistant',content:d.reply}); }
      else { bubble('assistant', EN()?'I could not answer that just now — tap WhatsApp below and our team will help.':'No pude responder ahora — toca WhatsApp abajo y nuestro equipo te ayuda.'); }
    }catch(e){ t.remove(); bubble('assistant', EN()?'Connection issue — please use WhatsApp below.':'Problema de conexión — usa WhatsApp abajo.'); }
    sending=false; send.disabled=false;
  }
  send.addEventListener('click',ask);
  text.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); ask(); } });
})();
</script>
<!-- /GNP-CHAT-WIDGET -->
</body>
</html>
